kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "run", "build:production"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Launcher starts the API server AND the Discord bot as sibling processes,
# so the bot stays connected 24/7 under the same Reserved VM deployment.
args = ["node", "artifacts/api-server/prod-launcher.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
